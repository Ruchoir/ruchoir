name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installs the toolchain pinned in rust-toolchain.toml (with rustfmt + clippy).
      - name: Set up Rust
        run: rustup show
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-features
      - name: Build (release)
        run: cargo build --release -p ruchoir-api

  web:
    name: Web (Next.js static export)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable corepack (pnpm)
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @ruchoir/web lint
      # Fails on user-visible text typed into a component rather than translated, and on any
      # disagreement between the six dictionaries. Both are invisible in review and silent at
      # runtime: an untranslated string simply ships in French to everyone.
      - name: Translations
        run: pnpm --filter @ruchoir/web i18n:check
      - name: Build (static export)
        run: pnpm --filter @ruchoir/web build

  responsive:
    name: Responsive audit (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable corepack (pnpm)
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm --filter @ruchoir/web exec playwright install --with-deps chromium
      - name: Start dev server
        # The audit reaches each screen via the dev deep-link, which only exists in development,
        # so it must run against `next dev` (not the production static export).
        run: pnpm --filter @ruchoir/web dev &
      - name: Wait for the dev server
        run: |
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/; then echo "up"; exit 0; fi
            sleep 2
          done
          echo "dev server did not start" >&2; exit 1
      - name: Run responsive audit (fails on critical overflow or JS error)
        run: pnpm --filter @ruchoir/web audit:responsive -- --quick --fail-on critical
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-audit-report
          path: apps/web/tools/responsive-audit/report/
          if-no-files-found: ignore

  a11y:
    name: Accessibility audit (all themes)
    runs-on: ubuntu-latest
    # Required: the cross-theme audit is green (contrast, accessible names, icons, and the screen-reader
    # structure checks all pass on all four themes), so a regression on any --fail-rules blocks the PR.
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable corepack (pnpm)
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm --filter @ruchoir/web exec playwright install --with-deps chromium
      - name: Start dev server
        # Themes and screens are reached through the dev deep-link, which only exists in development.
        run: pnpm --filter @ruchoir/web dev &
      - name: Wait for the dev server
        run: |
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/; then echo "up"; exit 0; fi
            sleep 2
          done
          echo "dev server did not start" >&2; exit 1
      - name: Run accessibility audit (all four themes)
        # Fails on the hard a11y blockers: unnamed controls, illegible icons/text, unreachable dialogs,
        # and the screen-reader structure checks (language, landmarks, headings, ARIA integrity).
        run: pnpm --filter @ruchoir/web audit:a11y -- --quick --fail-rules accessible-name,icon-contrast,img-alt,low-contrast,dialog-overflows-viewport,html-lang,landmark-main,heading-order,aria-hidden-focusable,aria-ref-broken,duplicate-id,dialog-name
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-audit-report
          path: apps/web/tools/responsive-audit/report/
          if-no-files-found: ignore

  audit:
    name: Security audit (informational)
    runs-on: ubuntu-latest
    # Day-one advisories in deep transitive deps should not block the whole pipeline.
    # Tighten to required once the dependency tree is triaged during hardening.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        run: rustup show
      - name: cargo audit
        # RUSTSEC-2026-0235 (rkyv 0.7 out-of-bounds read on Rc/Arc archives): transitive only, via
        # rust_decimal's rkyv feature that sea-orm's default features pull in through sea-query. The
        # code never deserializes rkyv archives, so the vulnerable path is unreachable, and there is
        # no fix on the 0.7 line (0.8 is a breaking change rust_decimal 1.x does not support). Remove
        # this ignore once sea-orm / rust_decimal move to rkyv >= 0.8.17.
        #
        # RUSTSEC-2026-0194 / RUSTSEC-2026-0195 (quick-xml 0.38 quadratic start-tag scan and unbounded
        # namespace allocation, both denial-of-service on crafted XML): transitive only, via the S3
        # client (rust-s3 / aws-creds), which uses quick-xml solely to parse responses from the
        # configured object store. That store is the operator's own trusted, non-public backend
        # (Garage by default), not an attacker-controlled source, so the crafted-input path is not
        # reachable from untrusted callers. The fix landed in quick-xml >= 0.41, but rust-s3 and
        # aws-creds both cap it at ^0.38, so it cannot be updated in range. Remove these ignores once
        # the S3 client moves to quick-xml >= 0.41.
        run: |
          cargo install cargo-audit --locked
          cargo audit --ignore RUSTSEC-2026-0235 --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: pnpm audit
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm -r audit
