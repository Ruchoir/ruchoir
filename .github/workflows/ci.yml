name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # What a pull request touches decides what runs: a change to the phone app alone does not wait on
  # the Rust suite or the web audits. A job skipped this way reports as passed to the required checks.
  # Every push to main runs everything.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
      web: ${{ steps.diff.outputs.web }}
      mobile: ${{ steps.diff.outputs.mobile }}
      desktop: ${{ steps.diff.outputs.desktop }}
      deps: ${{ steps.diff.outputs.deps }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge commit and its first parent, the base it is compared with.
          fetch-depth: 2
      - id: diff
        name: Sort the changed files
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            for area in rust web mobile desktop deps; do echo "$area=true" >> "$GITHUB_OUTPUT"; done
            exit 0
          fi
          git diff --name-only HEAD^1 HEAD > changed.txt
          cat changed.txt
          touches() { grep -qE "$1" changed.txt && echo true || echo false; }
          # A change to the workflow runs everything; the JavaScript workspace's own files concern
          # both apps.
          wf='^\.github/workflows/'
          js='^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|\.nvmrc)$'
          echo "rust=$(touches "^(apps/api/|apps/push-relay/|migrations/|packages/importer/|Cargo\.(toml|lock)$|rust-toolchain\.toml$)|$wf")" >> "$GITHUB_OUTPUT"
          echo "web=$(touches "^(apps/web/|packages/client/|packages/design-system/)|$js|$wf")" >> "$GITHUB_OUTPUT"
          # The phone app's translation check is the web's i18n audit tool.
          echo "mobile=$(touches "^(apps/mobile/|packages/client/|packages/design-system/styles/tokens\.css$|apps/web/tools/i18n-audit/)|$js|$wf")" >> "$GITHUB_OUTPUT"
          # The desktop app's core alone: a web change never starts it (the desktop's own build of the
          # interface is checked by the on-demand desktop workflow).
          echo "desktop=$(touches "^apps/desktop/|$wf")" >> "$GITHUB_OUTPUT"
          echo "deps=$(touches "^(Cargo\.lock|pnpm-lock\.yaml|apps/desktop/Cargo\.lock)$|$wf")" >> "$GITHUB_OUTPUT"

  api:
    name: API (Rust)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    # The end-to-end tests boot the real router against a real database and cache. Without these
    # they skip themselves and the suite still reports success, which is worse than having no tests
    # at all: it reported green while a defect that one of them catches was shipped.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ruchoir
          POSTGRES_PASSWORD: ruchoir
          POSTGRES_DB: ruchoir_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ruchoir"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey:9-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # The import chain's producer runs against a real MariaDB (see the import steps below).
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ruchoir
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      # Installs the toolchain pinned in rust-toolchain.toml (with rustfmt + clippy).
      - name: Set up Rust
        run: rustup show
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Debug builds only (the release build has a cache of its own); a change of the lockfile
          # starts from the last cache rather than from nothing.
          key: cargo-debug-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-debug-${{ runner.os }}-
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        env:
          RUCHOIR_TEST_DATABASE_URL: postgres://ruchoir:ruchoir@localhost:5432/ruchoir_test
          VALKEY_TEST_URL: redis://localhost:6379
        run: cargo test --all-features
      # The import is the product's signature feature, and its risky half is SQL against a real
      # database. Every defect the Nextcloud producer has had was invisible until a database
      # answered: a client speaking utf8mb3 and destroying every emoji, a CAST MariaDB does not
      # support, a filter that silently dropped guests. So the producer runs here for real. It lives
      # in this job because it needs the API binary, which reuses the tests' compiled dependencies
      # here rather than being built from nothing in a job of its own.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install a MariaDB client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mariadb-client
      - name: Check the import scripts parse
        run: |
          bash -n packages/importer/export-nextcloud.sh
          python3 -m py_compile packages/importer/convert-mattermost.py \
            packages/importer/convert-slack.py packages/importer/validate-archive.py
      - name: Build the API, for the archive checker inside it
        # The contract has two implementations and they have twice reached opposite verdicts on the
        # same archive, each time letting a broken export through the checker beside the producer.
        # The cross-check needs the real one, so it is built here rather than skipped. Same features
        # as the tests, so the dependencies they compiled are reused.
        run: cargo build -p ruchoir-api --all-features
      - name: Test the import chain
        # The two REQUIRE flags make a skipped test a failure: a suite that quietly skips its only
        # end-to-end test, or the only thing keeping the two checkers honest, reports green over an
        # untested feature.
        env:
          RUCHOIR_TEST_MARIADB: host=127.0.0.1,port=3306,user=root,password=ruchoir
          RUCHOIR_TEST_REQUIRE_MARIADB: '1'
          RUCHOIR_TEST_REQUIRE_RUST_CHECKER: '1'
        working-directory: packages/importer/tests
        run: python3 -m unittest discover --verbose

  # The optimised build takes six minutes and fails only where the debug one already does, so pull
  # requests skip it; main still proves it builds, with a cache of its own so the pull requests'
  # cache stays small.
  api-release:
    name: API release build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        run: rustup show
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-release-${{ runner.os }}-
      - name: Build (release)
        run: cargo build --release -p ruchoir-api

  web:
    name: Web (Next.js static export)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable corepack (pnpm)
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      # The design system is shipped as TypeScript source to the web app and to Ruchoir Lab, which
      # compiles it with settings of its own: it has to type-check alone, not only through the app.
      - name: Design system types
        run: pnpm --filter @ruchoir/design-system typecheck
      - name: Lint
        run: pnpm --filter @ruchoir/web lint
      # Fails on user-visible text typed into a component rather than translated, on a formatting
      # call with a language written into it, on one sentence held under two keys, and on any
      # disagreement between the six dictionaries. An untranslated string ships in French to
      # everyone and reports nothing.
      - name: Translations (six languages)
        run: pnpm --filter @ruchoir/web i18n:check
      - name: Build (static export)
        run: pnpm --filter @ruchoir/web build

  # A job of its own rather than a step of the web build, so that it is named in the checks list and
  # can be required on its own: what it guards is invisible in review and silent at runtime, and a
  # green "Web" tells nobody whether it ran.
  mobile:
    name: Mobile app (Expo) and shared API client
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    env:
      # The Expo CLI reports anonymous usage by default; Ruchoir never sends it (ADR 0005).
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable corepack (pnpm)
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Shared client (types and tests)
        run: pnpm --filter @ruchoir/client typecheck && pnpm --filter @ruchoir/client test
      - name: Typecheck
        run: pnpm --filter @ruchoir/mobile typecheck
      - name: Lint
        run: pnpm --filter @ruchoir/mobile lint
      - name: Tests
        run: pnpm --filter @ruchoir/mobile test
      - name: Translations
        run: pnpm --filter @ruchoir/mobile i18n:check
      - name: Bundle for iOS (Metro, no native build)
        run: CI=1 pnpm --filter @ruchoir/mobile bundle:ios

  # Light on purpose (the pipeline is heavy already): the desktop app's Tauri-free core only, which
  # builds without WebKitGTK. The app itself, its end to end check, the lightness budget and the
  # builds for the three systems are in the on-demand `desktop-build.yml`.
  desktop:
    name: Desktop core (Rust)
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      # Installs the toolchain pinned in apps/desktop/rust-toolchain.toml (with rustfmt + clippy).
      - name: Set up Rust
        run: rustup show
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/target
          key: cargo-desktop-core-${{ runner.os }}-${{ hashFiles('apps/desktop/Cargo.lock') }}
          restore-keys: cargo-desktop-core-${{ runner.os }}-
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy -p ruchoir-desktop-core --all-targets -- -D warnings
      - name: Test
        run: cargo test -p ruchoir-desktop-core

  audits:
    name: Web audits (responsive and accessibility)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    # Required: the cross-theme audit is green (contrast, accessible names, icons, and the screen-reader
    # structure checks all pass on every theme), so a regression on any --fail-rules blocks the PR. It
    # is also the responsive audit: the base theme over the quick widths, failing on a critical overflow
    # or a JS error, is part of its sweep, so that audit no longer runs on its own.
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable corepack (pnpm)
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm --filter @ruchoir/web exec playwright install --with-deps chromium
      - name: Start dev server
        # Themes and screens are reached through the dev deep-link, which only exists in development.
        run: pnpm --filter @ruchoir/web dev &
      - name: Wait for the dev server
        run: |
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/; then echo "up"; exit 0; fi
            sleep 2
          done
          echo "dev server did not start" >&2; exit 1
      - name: Run the audit (every theme, four at a time)
        # Fails on a critical overflow or a JS error, and on the hard a11y blockers: unnamed controls,
        # illegible icons/text, unreachable dialogs, and the screen-reader structure checks (language,
        # landmarks, headings, ARIA integrity). The themes run side by side, each in its own browser
        # context, on the runner's four cores.
        run: pnpm --filter @ruchoir/web audit:a11y -- --quick --concurrency 4 --fail-rules accessible-name,icon-contrast,img-alt,low-contrast,dialog-overflows-viewport,html-lang,landmark-main,heading-order,aria-hidden-focusable,aria-ref-broken,duplicate-id,dialog-name
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-audit-report
          path: apps/web/tools/responsive-audit/report/
          if-no-files-found: ignore

  audit:
    name: Security audit (informational)
    needs: changes
    # The lockfiles changed, or main moved (new advisories appear without any change of ours).
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    # Day-one advisories in deep transitive deps should not block the whole pipeline.
    # Tighten to required once the dependency tree is triaged during hardening.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        run: rustup show
      # cargo-audit took two minutes to compile on every run: kept between runs, renewed each month.
      - name: This month
        id: month
        run: echo "month=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Cache cargo-audit
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ steps.month.outputs.month }}
      - name: cargo audit
        # RUSTSEC-2026-0235 (rkyv 0.7 out-of-bounds read on Rc/Arc archives): transitive only, via
        # rust_decimal's rkyv feature that sea-orm's default features pull in through sea-query. The
        # code never deserializes rkyv archives, so the vulnerable path is unreachable, and there is
        # no fix on the 0.7 line (0.8 is a breaking change rust_decimal 1.x does not support). Remove
        # this ignore once sea-orm / rust_decimal move to rkyv >= 0.8.17.
        #
        # RUSTSEC-2026-0194 / RUSTSEC-2026-0195 (quick-xml 0.38 quadratic start-tag scan and unbounded
        # namespace allocation, both denial-of-service on crafted XML): transitive only, via the S3
        # client (rust-s3 / aws-creds), which uses quick-xml solely to parse responses from the
        # configured object store. That store is the operator's own trusted, non-public backend
        # (Garage by default), not an attacker-controlled source, so the crafted-input path is not
        # reachable from untrusted callers. The fix landed in quick-xml >= 0.41, but rust-s3 and
        # aws-creds both cap it at ^0.38, so it cannot be updated in range. Remove these ignores once
        # the S3 client moves to quick-xml >= 0.41.
        #
        # RUSTSEC-2023-0071 (rsa 0.9 Marvin Attack, key recovery through a timing sidechannel):
        # transitive only, via pgp (rPGP), which opens the sealed import archive. The vulnerable
        # path is RSA private-key operations, and the tree performs none: the single PGP call is
        # `Message::decrypt_with_password` in `apps/api/src/importer/archive.rs`, symmetric
        # passphrase decryption, because an archive is sealed with a passphrase rather than a key.
        # There is no fixed release on the rsa 0.9 line. Remove this ignore once rsa ships a
        # constant-time fix, or once rPGP no longer pulls it in.
        run: |
          command -v cargo-audit >/dev/null || cargo install cargo-audit --locked
          cargo audit --ignore RUSTSEC-2026-0235 --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195 --ignore RUSTSEC-2023-0071
      - name: cargo audit (desktop app)
        # Its own workspace and lockfile (apps/desktop). Warnings only so far: unmaintained crates of
        # the GTK and D-Bus stacks Tauri builds on.
        run: cargo audit --file apps/desktop/Cargo.lock
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: pnpm audit
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm -r audit
