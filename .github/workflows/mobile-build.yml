name: Phone apps

# Builds the development build of the phone apps (docs/mobile-builds.md): our own app with Expo's
# development launcher, which opens Metro. On demand only, never on every pull request: the "Run
# workflow" button, or the label `app-build` on a pull request of this repository to try a branch on
# the phone before it is merged.
#
# - iPhone: GitHub's macOS runner builds it, Apple signs it at export through the App Store Connect
#   API key, and it goes straight to TestFlight (internal testing only).
# - Android: a debug APK for the emulator, kept as an artifact of the run.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which app to build
        type: choice
        options: [both, ios, android]
        default: both
  pull_request:
    types: [labeled]

permissions:
  contents: read

env:
  # The Expo CLI reports anonymous usage by default; Ruchoir never sends it (ADR 0005).
  EXPO_NO_TELEMETRY: "1"
  # The build number Apple and Google see, read by app.config.ts: each run is above the last.
  RUCHOIR_BUILD_NUMBER: ${{ github.run_number }}

jobs:
  ios:
    name: iPhone (TestFlight)
    # A pull request from a fork never receives the secrets, so it is not built at all.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.platform != 'android') ||
      (github.event_name == 'pull_request' && github.event.label.name == 'app-build' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: macos-26
    timeout-minutes: 90
    # One build per branch at a time, and never one cancelled half way through an upload. Set on the
    # job, not the workflow, so a run for another label (skipped by the condition above) never takes
    # the slot or cancels a waiting build.
    concurrency:
      group: mobile-build-ios-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        # Apple requires the iOS 26 SDK. The newest Xcode 26 on the image, by version.
        run: |
          xcode=$(printf '%s\n' /Applications/Xcode_26*.app | grep -E '/Xcode_26(\.[0-9]+)*\.app$' | sort -V | tail -1)
          echo "Using $xcode"
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable corepack (pnpm)
        run: corepack enable
      - name: Write the App Store Connect key
        env:
          KEY: ${{ secrets.APPLE_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          if [ -z "$KEY" ] || [ -z "$KEY_ID" ]; then
            echo "::error::The APPLE_* secrets are missing: see docs/mobile-builds.md."
            exit 1
          fi
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
      - name: Check the App Store Connect key
        # A minute instead of the whole build to learn that a secret is wrong.
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          BUNDLE_ID: com.ruchoir.app
        run: KEY_PATH="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8" node .github/scripts/check-app-store-key.mjs
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate the native project
        working-directory: apps/mobile
        # Also installs the CocoaPods. The team id names who the extensions are made for.
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx expo prebuild --platform ios
      - name: Archive
        # Unsigned: Xcode's automatic signing would ask for a development profile, which Apple only
        # makes for a team with a registered device, and the team has none. The Debug configuration
        # is where the development launcher lives.
        working-directory: apps/mobile/ios
        run: |
          xcodebuild archive -quiet \
            -workspace Ruchoir.xcworkspace -scheme Ruchoir -configuration Debug \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Ruchoir.xcarchive" \
            CODE_SIGNING_ALLOWED=NO
      - name: Sign ad hoc
        # The export re-signs everything for the App Store, but it takes the entitlements from the
        # signature it finds: an unsigned app would lose them. Xcode did not sign, so it did not
        # expand `$(AppIdentifierPrefix)` either: done here with the team id. Nested code first (the
        # frameworks, then each extension with its own entitlements), the app last.
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          app="$RUNNER_TEMP/Ruchoir.xcarchive/Products/Applications/Ruchoir.app"
          expand() { sed "s/\$(AppIdentifierPrefix)/$TEAM_ID./g" "$1" > "$2"; }
          sign_frameworks() {
            if [ -d "$1/Frameworks" ]; then
              find "$1/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) \
                -exec codesign --force --sign - {} \;
            fi
          }
          sign_frameworks "$app"
          if [ -d "$app/PlugIns" ]; then
            for extension in "$app"/PlugIns/*.appex; do
              name=$(basename "$extension" .appex)
              sign_frameworks "$extension"
              expand "apps/mobile/ios/.targets/$name/generated.entitlements" "$RUNNER_TEMP/$name.entitlements"
              codesign --force --sign - --entitlements "$RUNNER_TEMP/$name.entitlements" "$extension"
            done
          fi
          expand apps/mobile/ios/Ruchoir/Ruchoir.entitlements "$RUNNER_TEMP/Ruchoir.entitlements"
          codesign --force --sign - --entitlements "$RUNNER_TEMP/Ruchoir.entitlements" "$app"
          codesign -d --entitlements - "$app"
      - name: Register the bundle ids
        # The app and its extensions, and the push capability, known to Apple before the export
        # asks for their profiles.
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: KEY_PATH="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8" node .github/scripts/register-app-ids.mjs
      - name: Sign for the App Store
        # Apple creates and keeps the distribution certificate itself (cloud signing): nothing to
        # store here but the API key. The upload is a step of its own: Xcode's content delivery
        # service refused the team key ("Cannot verify client's JWT headers") that the API accepts.
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>testFlightInternalTestingOnly</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Ruchoir.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
          ls -l "$RUNNER_TEMP/export"
      - name: Upload to TestFlight
        # Through the App Store Connect API's build uploads, with the same key.
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          BUNDLE_ID: com.ruchoir.app
        run: |
          plist="$RUNNER_TEMP/Ruchoir.xcarchive/Products/Applications/Ruchoir.app/Info.plist"
          VERSION=$(plutil -extract CFBundleShortVersionString raw "$plist") \
          BUILD_NUMBER=$(plutil -extract CFBundleVersion raw "$plist") \
          IPA_PATH="$RUNNER_TEMP/export/Ruchoir.ipa" \
          KEY_PATH="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8" \
            node .github/scripts/upload-to-app-store.mjs
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8

  android:
    name: Android (emulator APK)
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.platform != 'ios') ||
      (github.event_name == 'pull_request' && github.event.label.name == 'app-build' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: mobile-build-android-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        # React Native's Gradle plugin asks for the Java 17 toolchain.
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable corepack (pnpm)
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: The Firebase project's file
        # What Android needs to receive pushes (ADR 0006); without it the app builds and simply
        # cannot be reached by notifications.
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > "$RUNNER_TEMP/google-services.json"
            echo "GOOGLE_SERVICES_FILE=$RUNNER_TEMP/google-services.json" >> "$GITHUB_ENV"
          else
            echo "::warning::No GOOGLE_SERVICES_JSON secret: this APK will not receive notifications."
          fi
      - name: Generate the native project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android
      - name: Build the debug APK
        # An emulator runs x86_64 on a PC and arm64 on an Apple Silicon Mac; the 32-bit ones are left
        # out to halve the build.
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon -PreactNativeArchitectures=arm64-v8a,x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: ruchoir-dev-android-${{ github.run_number }}
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
