# Push relay release (ADR 0006): a tag `push-relay-v1.2.3` builds the relay's image, pushes it to
# Ruchoir's own registry, and deploys it on the website's server, where https://ruchoir.com/push/
# serves it. The relay ships on its own, apart from the instance's `v1.2.3` tags (release.yml): every
# instance uses it, whatever version each runs.
#
# Needs, besides the registry account release.yml uses:
#   secrets RELAY_DEPLOY_SSH_KEY       the private key bound to push-relay-deploy-entry
#   secrets RELAY_DEPLOY_KNOWN_HOSTS   the website server's host keys, as `ssh-keyscan` prints them
#   variables RELAY_DEPLOY_HOST        the website's server
name: Push relay release

on:
  push:
    tags: ["push-relay-v[0-9]+.[0-9]+.[0-9]+", "push-relay-v[0-9]+.[0-9]+.[0-9]+-*"]

permissions:
  contents: read

concurrency:
  group: push-relay-release
  cancel-in-progress: false

env:
  IMAGE: registry.ruchoir.com/ruchoir/push-relay

jobs:
  image:
    name: Build and push the image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: The version, from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: echo "version=${TAG#push-relay-}" >> "$GITHUB_OUTPUT"

      - name: Log in to the registry
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: printf '%s' "$REGISTRY_PASSWORD" | docker login registry.ruchoir.com -u "$REGISTRY_USER" --password-stdin

      - name: Build and push
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker buildx create --use --driver docker-container >/dev/null
          docker buildx build \
            --file apps/push-relay/Dockerfile \
            --cache-from "type=registry,ref=$IMAGE:buildcache" \
            --cache-to "type=registry,ref=$IMAGE:buildcache,mode=max" \
            --tag "$IMAGE:$VERSION" \
            --push \
            .

  deploy:
    name: Deploy
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Bundle what the server needs besides the image
        run: tar -czf bundle.tar.gz infra/push-relay

      - name: Deploy through the deploy account
        env:
          RELAY_DEPLOY_SSH_KEY: ${{ secrets.RELAY_DEPLOY_SSH_KEY }}
          RELAY_DEPLOY_KNOWN_HOSTS: ${{ secrets.RELAY_DEPLOY_KNOWN_HOSTS }}
          RELAY_DEPLOY_HOST: ${{ vars.RELAY_DEPLOY_HOST }}
          VERSION: ${{ needs.image.outputs.version }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$RELAY_DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$RELAY_DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes "deploy@$RELAY_DEPLOY_HOST" "$VERSION" < bundle.tar.gz
