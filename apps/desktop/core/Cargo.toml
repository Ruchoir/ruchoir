[package]
name = "ruchoir-desktop-core"
description = "The desktop app's logic that needs no window: instances, tokens, sign-in, proxy rules, realtime."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
publish = false

[dependencies]
getrandom = "0.3"
keyring = { version = "=3.6.3", features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[dev-dependencies]
tempfile = "3"
