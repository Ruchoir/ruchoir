[package]
name = "ruchoir-desktop"
description = "Ruchoir for Windows, macOS and Linux."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
ruchoir-desktop-core = { path = "../core" }
tauri = { version = "=2.12.4", features = ["tray-icon", "image-png"] }
tauri-plugin-deep-link = "=2.6.2"
tauri-plugin-single-instance = { version = "=2.5.4", features = ["deep-link"] }
tauri-plugin-window-state = "=2.5.0"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-store = "=2.5.0"
tauri-plugin-notification = "=2.7.0"
tauri-plugin-autostart = "=2.7.0"
time = { version = "0.3", features = ["local-offset", "formatting"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["rt-multi-thread"] }
