# Ruchoir all-in-one stack for local development and single-node deployment.
#
# One production service (`api`) serves both the REST/real-time API and the static web
# bundle. It is backed by PostgreSQL (source of truth), Valkey (sessions, pub/sub,
# presence, cache) and Garage (S3-compatible object storage).
#
# Copy `.env.example` to `.env` and fill in values before `docker compose up`.
name: ruchoir

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ruchoir}
      POSTGRES_USER: ${POSTGRES_USER:-ruchoir}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # Postgres 18+ images store data in a version-specific subdirectory, so the mount
      # point is /var/lib/postgresql (not /var/lib/postgresql/data as in older images).
      - postgres-data:/var/lib/postgresql
    ports:
      # Published so the API can run on the host (cargo run) against localhost. Change the host
      # port if 5432 is already taken locally.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ruchoir} -d ${POSTGRES_DB:-ruchoir}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  valkey:
    image: valkey/valkey:9-alpine
    command: ["valkey-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - valkey-data:/data
    ports:
      # Published for host-side dev (cargo run). Change the host port if 6379 is taken.
      - "${VALKEY_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  garage:
    image: dxflrs/garage:v2.3.0
    environment:
      # Secrets are injected here, never stored in the repo (see infra/garage/garage.toml).
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET in .env}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-}
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    ports:
      # S3 API published so the API can run on the host (cargo run) against localhost:3900. Change
      # the host port if 3900 is already taken. The RPC port (3901) stays internal to the network.
      - "${GARAGE_S3_HOST_PORT:-3900}:3900"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # Everything the API reads that is not overridden below. Compose reads .env for its own
    # interpolation, which is a separate thing: without this the container receives only the dozen
    # variables named in `environment`, and RUCHOIR_PUBLIC_BASE_URL, the SMTP relay, the WebAuthn
    # settings and RUCHOIR_SECRET_ENCRYPTION_KEY silently fall back to their development defaults on
    # a real deployment. Optional so a checkout with no .env still starts for development.
    env_file:
      - path: .env
        required: false
    # These win over the file above, and must: .env holds the values a run on the host needs, where
    # the services answer on published ports rather than under their container names.
    environment:
      RUCHOIR_API_HOST: 0.0.0.0
      RUCHOIR_API_PORT: 8080
      RUCHOIR_WEB_DIST: /srv/ruchoir/web
      RUST_LOG: ${RUST_LOG:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-ruchoir}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ruchoir}
      VALKEY_URL: redis://valkey:6379
      S3_ENDPOINT: http://garage:3900
      S3_REGION: ${S3_REGION:-garage}
      S3_BUCKET: ${S3_BUCKET:-ruchoir}
      # Credentials issued by Garage after key/bucket setup. When unset, the API still serves file
      # metadata and reports 503 for file bytes (see .env.example and docs/development.md).
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      RUCHOIR_UPLOAD_MAX_BYTES: ${RUCHOIR_UPLOAD_MAX_BYTES:-104857600}
      RUCHOIR_THUMBNAIL_MAX_PX: ${RUCHOIR_THUMBNAIL_MAX_PX:-512}
      # Where the importer looks for archives, fixed inside the container. The host directory that
      # lands there is RUCHOIR_IMPORT_HOST_DIR, below: this path is what the API sees, and the two
      # are deliberately separate so that renaming a directory on the host cannot change what an
      # administrator types into the screen.
      RUCHOIR_IMPORT_DIR: /srv/ruchoir/imports
      # Live office editing (optional). Empty unless the `office` profile runs and `.env` sets the
      # two addresses; see docs/office-editing.md. The engine reaches the WOPI listener on the
      # internal network only: 8081 is never published.
      RUCHOIR_OFFICE_URL: ${RUCHOIR_OFFICE_URL:-}
      RUCHOIR_OFFICE_PUBLIC_URL: ${RUCHOIR_OFFICE_PUBLIC_URL:-}
      RUCHOIR_WOPI_LISTEN: 0.0.0.0:8081
      RUCHOIR_WOPI_BASE_URL: http://api:8081
    volumes:
      # Archives land here two ways: dropped by scp or a share, or delivered by the one-time upload
      # an export command carries (see the import screen). Read-write, because that delivery writes
      # the archive here; the importer itself still only ever reads what it finds.
      - ${RUCHOIR_IMPORT_HOST_DIR:-./imports}:/srv/ruchoir/imports:rw
    ports:
      # Host port is configurable (default 8080) to avoid clashes with other local projects.
      # Only the published host port changes; the container still listens on 8080.
      - "${RUCHOIR_HOST_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      garage:
        condition: service_started
    networks:
      - default
      # Shared with the office engine only, so the engine can reach the WOPI listener.
      - office
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # Live office editing (optional): Euro-Office, run with `docker compose --profile office up -d`.
  # Never published: the API relays the editor's own hostname to it and serves it files over WOPI.
  # About 2 GB of memory at rest (capped below) and 7 GB of disk for the image. See
  # docs/office-editing.md, ADR 0003 and infra/office/README.md.
  office:
    profiles: ["office"]
    image: ghcr.io/euro-office/documentserver:${OFFICE_IMAGE_TAG:-v9.3.4-hotfix.1}
    environment:
      # The engine refuses its own (non-WOPI) API without a signed token. Ruchoir never calls that
      # API, so an empty secret is fine: the engine then draws a random one at start. Not `:?`,
      # which Compose would evaluate even without the profile and so break every command.
      JWT_ENABLED: "true"
      JWT_SECRET: ${OFFICE_JWT_SECRET:-}
      WOPI_ENABLED: "true"
      # The WOPI listener (api:8081) is on the private compose network.
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      EXAMPLE_ENABLED: "false"
    volumes:
      - ./infra/office/local-production-linux.json:/etc/euro-office/documentserver/local-production-linux.json:ro
      - ./infra/office/themes/theme-ruchoir-light.json:/var/www/euro-office/documentserver/web-apps/apps/common/main/resources/themes/theme-ruchoir-light.json:ro
      - ./infra/office/themes/theme-ruchoir-dark.json:/var/www/euro-office/documentserver/web-apps/apps/common/main/resources/themes/theme-ruchoir-dark.json:ro
      - ./infra/office/patches/editor-wopi.ejs:/var/www/euro-office/documentserver/web-apps/apps/api/wopi/editor-wopi.ejs:ro
      - ./infra/office/patches/visioeditor-index.html:/var/www/euro-office/documentserver/web-apps/apps/visioeditor/main/index.html:ro
    mem_limit: ${OFFICE_MEM_LIMIT:-4g}
    # On the internal network only: no route out, so whatever a document or a crafted request asks
    # the engine to fetch, it can reach nothing but the API.
    networks:
      - office
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/healthcheck || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: unless-stopped

networks:
  # The office engine's network: the API and the engine, no egress (`internal`).
  office:
    internal: true

volumes:
  postgres-data:
  valkey-data:
  garage-meta:
  garage-data:
