# SSH settings for a Ruchoir server (infra/hardening/hygiene). Installed as
# /etc/ssh/sshd_config.d/50-ruchoir.conf and applied through `ruchoir-guard apply sshd 5`.
# The deploy and backup-pull keys stay forced-command: their authorized_keys lines decide.

# No tunnels for anyone but the administrator, who uses them (Match block below).
AllowTcpForwarding no
LoginGraceTime 20
ClientAliveInterval 300
ClientAliveCountMax 2

KexAlgorithms sntrup761x25519-sha512,mlkem768x25519-sha256,curve25519-sha256
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com

# Last on purpose: a Match block holds every line that follows it in this file.
Match User theo
    AllowTcpForwarding yes
