# ntfy, the push service the alerts go through. Role site only; installed by ntfy/install.sh in
# /opt/ruchoir-ntfy, driven as its own Compose project (ruchoir-ntfy), never mixed with the others.
#
# NTFY_BASE_URL (the public https address) comes from the .env file next to this one, which the
# install renders from hardening.env: no hostname lives in this repository.
# NTFY_DATA_DIR and NTFY_BIND have defaults and are overridden only by the tests.
name: ruchoir-ntfy

services:
  ntfy:
    image: binwiederhier/ntfy:v2.37.0
    command: ["serve"]
    restart: unless-stopped
    user: "10096:10096"
    ports:
      - "${NTFY_BIND:-127.0.0.1:8096}:8080"
    environment:
      NTFY_BASE_URL: "${NTFY_BASE_URL:?set NTFY_BASE_URL in .env}"
    volumes:
      - ./server.yml:/etc/ntfy/server.yml:ro
      - "${NTFY_DATA_DIR:-/var/lib/ruchoir-ntfy}:/var/lib/ntfy"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/v1/health | grep -q '\"healthy\":true'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
