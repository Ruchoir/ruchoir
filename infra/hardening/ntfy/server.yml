# ntfy server configuration (mounted read-only at /etc/ntfy/server.yml).
# The public address (base-url) is not here: it arrives as NTFY_BASE_URL from the compose file.

# Behind the host nginx, which terminates TLS; only the host's loopback reaches this port.
listen-http: ":8080"
behind-proxy: true

# Nobody reads or writes anything without an account: one reader, one publish-only token per
# server, all created by ntfy/install.sh. No sign-up, no anonymous topic.
auth-file: "/var/lib/ntfy/user.db"
auth-default-access: "deny-all"
enable-signup: false
enable-login: true

# Messages are kept briefly, for a phone that was offline.
cache-file: "/var/lib/ntfy/cache.db"
cache-duration: "24h"

# No attachments, no web app, no metrics endpoint: the phone app is the only reader.
web-root: "disable"
enable-metrics: false

# The iPhone app is woken through the public ntfy.sh relay and Apple's push service. The relay
# receives a message identifier only; the content stays on this server (the app fetches it here).
upstream-base-url: "https://ntfy.sh"

log-level: "info"
