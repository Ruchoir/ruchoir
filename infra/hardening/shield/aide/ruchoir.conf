# AIDE rules for a Ruchoir server. Installed as /etc/aide/ruchoir.conf by infra/hardening (shield).
# Standalone: it does not read Ubuntu's /etc/aide/aide.conf, so the distribution's own daily job
# (disabled by the installer) and this one never disagree.

database_in=file:/var/lib/aide/ruchoir.db
database_out=file:/var/lib/aide/ruchoir.db.new
database_new=file:/var/lib/aide/ruchoir.db.new
gzip_dbout=no
log_level=warning
report_level=changed_attributes
report_url=stdout

# What is compared. Content (sha512) plus ownership, mode and links for binaries and
# configuration; ownership and mode only where content legitimately changes.
Full = p+ftype+i+n+u+g+s+m+c+sha512
Perm = p+ftype+u+g

# System binaries and libraries.
/boot Full
/usr/bin Full
/usr/sbin Full
/usr/lib Full
/usr/libexec Full
/bin Full
/sbin Full
/lib Full
/usr/local/bin Full
/usr/local/sbin Full
/usr/local/lib Full

# Configuration, minus what the system rewrites by itself.
/etc Full
!/etc/mtab
!/etc/resolv.conf
!/etc/machine-id
!/etc/adjtime
!/etc/.pwd.lock
!/etc/ld.so.cache
!/etc/letsencrypt
!/etc/ssl/certs
!/etc/alternatives
!/etc/cups
!/etc/nginx/ruchoir-exempt.conf$
!/etc/ruchoir-hardening/guard.d

# SSH keys that give access, for every account.
/root/.ssh Full
/home/[^/]+/\.ssh/authorized_keys$ Full

# The instance's compose file and the deploy entry points (the account that deploys and its scripts).
/opt/ruchoir/docker-compose.yml Full
/opt/ruchoir/docker-compose.override.yml Full
/opt/ruchoir/scripts Full
/opt/ruchoir/infra/deploy Full
/opt/ruchoir/.env Perm

# Never walked.
!/var
!/proc
!/sys
!/dev
!/run
!/tmp
!/srv
!/home/[^/]+/\.cache
