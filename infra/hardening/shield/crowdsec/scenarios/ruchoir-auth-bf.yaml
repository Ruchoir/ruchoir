# Repeated failed sign-ins on Ruchoir's authentication endpoints, from one address.
# Installed as /etc/crowdsec/scenarios/ruchoir-auth-bf.yaml by infra/hardening (shield).
#
# The API answers a wrong password, a wrong second factor or a wrong recovery code with 401, and an
# address that tries too often with 429 (not counted here: it is already throttled). The filter is
# kept to `==`, `in [...]` and `&&` so the test in tests/shield.sh can play it against a log line.
type: leaky
name: ruchoir/auth-bf
description: "Detect repeated failed sign-ins on the Ruchoir API"
filter: "evt.Meta.log_type == 'http_access-log' && evt.Meta.http_verb == 'POST' && evt.Meta.http_path in ['/api/v1/auth/login', '/api/v1/auth/mfa/totp/verify', '/api/v1/auth/mfa/recovery/verify'] && evt.Meta.http_status == '401'"
groupby: evt.Meta.source_ip
capacity: 10
leakspeed: "30s"
blackhole: 1m
reprocess: true
labels:
  service: http
  type: bruteforce
  remediation: true
