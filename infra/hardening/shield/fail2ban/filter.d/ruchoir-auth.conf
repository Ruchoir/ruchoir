# Failed sign-ins on Ruchoir's API, read from nginx's access log (combined format).
# Installed as /etc/fail2ban/filter.d/ruchoir-auth.conf by infra/hardening (shield).
#
# The API answers 401 to a wrong password, a wrong second factor or a wrong recovery code, and 429
# to an address that tries too often (not counted here: it is already throttled). A successful
# sign-in answers 200 and a normal page never matches: only POSTs to these three endpoints do.

[Definition]
failregex = ^<HOST> \S+ \S+ \[[^\]]*\] "POST /api/v1/auth/(?:login|mfa/totp/verify|mfa/recovery/verify)(?:\?\S*)? HTTP/\S+" 401 

ignoreregex =

datepattern = ^[^\[]*\[({DATE})
              {^LN-BEG}
