# nginx http-level hardening. Installed as /etc/nginx/conf.d/00-hardening.conf by
# infra/hardening (shield). Needs nginx 1.19.4 or later (ssl_reject_handshake).

# The house, the other server and loopback (rendered by the installer from the env file): never
# limited, so a deploy, a probe or the administrators cannot lock themselves out.
include /etc/nginx/ruchoir-exempt.conf;

# server_tokens is set to off in nginx.conf itself (it already declares the directive).

# Limit keys. A request whose key is empty is not counted, which is how the exempt addresses and,
# for the strict zone, everything outside the sign-in endpoints escape it.
map $ruchoir_exempt $ruchoir_limit_key {
    1       "";
    default $binary_remote_addr;
}
map "$ruchoir_exempt:$request_uri" $ruchoir_auth_key {
    ~^1:                    "";
    ~^0:/api/v1/auth/       $binary_remote_addr;
    default                 "";
}

# Generous for everything (sync bursts, uploads in chunks, many users behind one address), strict
# on the sign-in endpoints (the API throttles those too, per address and per account).
limit_req_zone  $ruchoir_limit_key zone=ruchoir_all:10m  rate=50r/s;
limit_req_zone  $ruchoir_auth_key  zone=ruchoir_auth:10m rate=30r/m;
limit_conn_zone $ruchoir_limit_key zone=ruchoir_conn:10m;
limit_req_status  429;
limit_conn_status 429;
limit_req_log_level  warn;
limit_conn_log_level warn;

# Slow-connection attacks. Uploads keep the vhost's own client_max_body_size and
# proxy_read_timeout; client_body_timeout is the gap between two reads, not the whole upload.
client_header_timeout 15s;
client_body_timeout   30s;
send_timeout          30s;
keepalive_timeout     30s;
reset_timedout_connection on;

# TLS: staple the OCSP answer when the certificate names a responder (nginx only warns when it
# does not), and keep no session ticket keys that outlive a restart.
resolver 127.0.0.53 valid=300s;
resolver_timeout 5s;
ssl_stapling on;
ssl_stapling_verify on;
ssl_session_tickets off;
