# Close connections for any Host this server has no vhost for (scanners on the bare address).
# Installed as /etc/nginx/conf.d/default-server.conf by infra/hardening (shield).
# If a vhost already carries `default_server`, nginx -t fails and the installer puts the old
# configuration back: remove that flag from the vhost first.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    # No certificate is shown to a client that asks for an unknown name.
    ssl_reject_handshake on;
}
