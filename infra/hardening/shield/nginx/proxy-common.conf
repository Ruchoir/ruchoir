# Headers and limits every proxied location shares. Installed as
# /etc/nginx/snippets/ruchoir-proxy.conf by infra/hardening (shield); include it inside each
# location that proxies to Ruchoir, in place of the vhost's own proxy_set_header lines:
#
#   location / {
#       proxy_pass http://127.0.0.1:8080;
#       proxy_http_version 1.1;
#       include snippets/ruchoir-proxy.conf;
#   }
#
# X-Forwarded-For is REPLACED by the address nginx saw, never appended to: the API keys its
# per-address rate limit on it, and a header the client could prefill would let one client look
# like many.
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header Forwarded "";

limit_req  zone=ruchoir_all  burst=200 nodelay;
limit_req  zone=ruchoir_auth burst=30  nodelay;
limit_conn ruchoir_conn 100;
