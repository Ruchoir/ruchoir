# Installed as /etc/logrotate.d/ruchoir-stats. Thirty-five days: enough for a month's active count,
# and no more; the statistics keep only the daily totals.
/var/log/nginx/ruchoir-usage.log /var/log/nginx/ruchoir-downloads.log {
	daily
	rotate 35
	missingok
	notifempty
	compress
	delaycompress
	create 0640 www-data adm
	sharedscripts
	postrotate
		invoke-rc.d nginx rotate >/dev/null 2>&1
	endscript
}
