# The website's server: the two log formats of Ruchoir's anonymous statistics (docs/desktop.md,
# "Usage statistics"). Installed as /etc/nginx/conf.d/ruchoir-stats.conf (http context). Neither
# holds the client's address: a desktop app's update check logs its random installation identifier,
# version and format; a download logs the file. The locations that use them are in the website
# repository's deploy/nginx/ruchoir.com.conf, which also keeps them out of the general access log.
log_format ruchoir_usage '$time_iso8601 $status "$http_x_ruchoir_install" "$http_x_ruchoir_version" "$http_x_ruchoir_format"';
log_format ruchoir_downloads '$time_iso8601 $status $request_method $uri';
