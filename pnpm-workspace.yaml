# pnpm workspace: the frontend (and, later, shared TS packages under packages/).
# The Rust API (apps/api) is a Cargo workspace member, not a pnpm one.
# packages/* are added here when they become real pnpm packages (design system later).
packages:
  - "apps/web"
allowBuilds:
  unrs-resolver: true
minimumReleaseAgeExclude:
  - lucide-react@1.37.0
# brace-expansion 5.0.9 has three published denial-of-service advisories (fixed in 5.0.12). minimatch
# 10 asks for ^5.0.8 and the lockfile kept the first match, which `pnpm update` will not move. Drop
# this once the lockfile resolves to 5.0.12 or later by itself.
overrides:
  "brace-expansion@>=5.0.0 <5.0.12": "5.0.12"
# GHSA-vfj7-8cjw-p6xm (braces <= 3.0.3, stack exhaustion on deeply nested brace patterns): dev only,
# via eslint-config-next > @next/eslint-plugin-next > fast-glob 3.3.1 > micromatch > braces. It runs
# at lint time on the repository's own glob patterns, never on input from a user, and nothing of it
# reaches the built app. There is no patched braces release, and the latest @next/eslint-plugin-next
# (16.3.8) still pins fast-glob 3.3.1. Drop this once either moves.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
