# pnpm workspace: the web, mobile and desktop apps and the TypeScript packages they share.
# The Rust API (apps/api) is a Cargo workspace member, not a pnpm one.
# packages/* are added here when they become real pnpm packages.
packages:
  - "apps/web"
  - "apps/mobile"
  - "apps/desktop"
  - "packages/client"
  - "packages/design-system"
allowBuilds:
  unrs-resolver: true
minimumReleaseAgeExclude:
  - lucide-react@1.37.0
# brace-expansion 5.0.9 has three published denial-of-service advisories (fixed in 5.0.12). minimatch
# 10 asks for ^5.0.8 and the lockfile kept the first match, which `pnpm update` will not move. Drop
# this once the lockfile resolves to 5.0.12 or later by itself.
#
# @xmldom/xmldom 0.7.13 has a run of high advisories (XML injection on serialization, unbounded
# recursion, quadratic attribute deduplication; fixed in 0.8.15). It comes through @bacons/xcode's
# old @expo/plist, which @bacons/apple-targets runs at prebuild to write the iPhone extensions'
# plists: build time only, never in the app. 0.8.15 is what the rest of the tree already uses.
# Drop this once @bacons/xcode moves to a newer @expo/plist.
overrides:
  "brace-expansion@>=5.0.0 <5.0.12": "5.0.12"
  "@xmldom/xmldom@<0.8.15": "0.8.15"
# GHSA-vfj7-8cjw-p6xm (braces <= 3.0.3, stack exhaustion on deeply nested brace patterns): dev only,
# via eslint-config-next > @next/eslint-plugin-next > fast-glob 3.3.1 > micromatch > braces. It runs
# at lint time on the repository's own glob patterns, never on input from a user, and nothing of it
# reaches the built app. There is no patched braces release, and the latest @next/eslint-plugin-next
# (16.3.8) still pins fast-glob 3.3.1. Drop this once either moves.
#
# GHSA-86w9-cpqp-85rv (node-forge <= 1.4.0, RSA PKCS#1 v1.5 signature verification) and
# GHSA-w5hq-g745-h8pq (uuid < 11.1.1, missing bounds check with a caller-provided buffer): dev only,
# both through the Expo CLI of apps/mobile (node-forge in @expo/cli itself, uuid 7 through xcode in
# @expo/config-plugins, which the CLI runs to generate native projects). They run on a developer's
# machine and never reach the app's bundle (Metro bundles the app's own code) nor the API image
# (its web stage installs only `@ruchoir/web...`). node-forge has no patched release, and xcode pins
# uuid 7. Drop these once the Expo CLI moves past them.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
    - GHSA-86w9-cpqp-85rv
    - GHSA-w5hq-g745-h8pq
